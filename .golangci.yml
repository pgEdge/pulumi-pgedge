version: "2"
linters:
  enable:
    - goconst
    - gosec
    - lll
    - misspell
    - nakedret
    - revive
    - unconvert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - schema.go
      - pulumiManifest.go
      - third_party$
      - builtin$
      - examples$
    rules:
      # schema_shape_test.go enumerates Pulumi schema field names like
      # "credentials" and "publicKey"; gosec G101 matches them as if they
      # were hardcoded secrets.
      - path: schema_shape_test\.go
        linters:
          - gosec
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
run:
  timeout: 120m
